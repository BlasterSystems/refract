name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Build and install package
        run: python -m pip install .
      - name: Verify installed CLI and packaged templates
        run: |
          refract --version
          refract init --platform all --dry-run --yes --target "${RUNNER_TEMP}/package-smoke"
      - name: Run unit, integration, and contract tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Validate repository
        env:
          PYTHONPATH: src
        run: python -m refract validate --target .

  test-gate:
    name: test-gate
    needs: test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless every test matrix leg succeeded
        run: |
          result="${{ needs.test.result }}"
          if [ "$result" != "success" ]; then
            echo "test matrix result: $result"
            exit 1
          fi
          echo "All test matrix legs passed."
