name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Build and install package
        run: python -m pip install .
      - name: Verify installed CLI and packaged templates
        run: |
          refract --version
          refract init --platform all --dry-run --yes --target "${RUNNER_TEMP}/package-smoke"
      - name: Run unit, integration, and contract tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Validate repository
        env:
          PYTHONPATH: src
        run: python -m refract validate --target .

  gate:
    name: check.sh
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # check.sh diffs the strict docs check against origin/main.
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Run the local gate (must equal every other check)
        run: scripts/check.sh

  test-gate:
    name: test-gate
    needs: [test, gate]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless every test matrix leg and the gate succeeded
        run: |
          for result in "${{ needs.test.result }}" "${{ needs.gate.result }}"; do
            if [ "$result" != "success" ]; then
              echo "required job result: $result"
              exit 1
            fi
          done
          echo "All test matrix legs and the gate passed."
