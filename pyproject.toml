[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "refract"
version = "0.3.1"
description = "Provider-neutral bootstrap for AI-assisted software projects"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.11"
authors = [{ name = "Mandala" }]

[project.urls]
Repository = "https://github.com/BlasterSystems/refract"
Changelog = "https://github.com/BlasterSystems/refract/blob/main/CHANGELOG.md"
Security = "https://github.com/BlasterSystems/refract/security/policy"

[project.scripts]
refract = "refract.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
refract = [
  "templates/**/*.md",
  "templates/**/*.json",
  "templates/**/*.toml",
  "templates/**/*.yml",
  "templates/**/*.yaml",
  "templates/**/*.sh",
  "templates/**/*.py",
  "templates/**/*.js",
  "templates/**/*.ts",
]

[tool.unittest]
start-directory = "tests"
